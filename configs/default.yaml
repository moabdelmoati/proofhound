language: javascript

budgets:
  run_timeout_s: 900          # whole pipeline per commit
  fuzz_time_per_target_s: 30
  max_tokens_per_run: 200000

harness:
  model: codecraft-claude     # key in `models` below
  probe_time_s: 5             # short fuzz run used to check coverage growth
  small_model_repair_attempts: 2
  large_model_repair_attempts: 2
  use_sast_hints: true        # false = unguided variant for RQ1

single_agent:                 # Term 1: one LLM drives every tool (proofhound scan --agent single)
  model: codecraft-claude     # key in `models` below; local-harness for the local model
  max_steps: 30               # model calls per run; the run budget above also applies

sandbox:
  image: proofhound/jazzerjs:latest
  network: none
  memory: 2g
  cpus: 2

sast:
  engine: semgrep
  rules_dir: rules/semgrep/javascript

cascade:
  enabled: false              # Term 1: large model only; small models are wired in Term 2
  triage_escalation_confidence: 0.6

output:
  dir: runs
  formats: [json, sarif]

# Models any agent can use. API keys are read from the environment / .env, never from this file.
models:
  claude:
    provider: anthropic
    model: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
    effort: high
    fallbacks: default        # server-side fallback if the model declines a request
  openai:
    provider: openai
    model: ""                 # fill in the model id you want to use
    api_key_env: OPENAI_API_KEY
  gemini:
    provider: openai_compatible
    model: ""                 # fill in the model id you want to use
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
  # CodeCraft gateway (OpenAI-compatible). Keys in .env; when one runs out of quota the client
  # moves to the next key in fallback_key_envs.
  codecraft-claude:           # smallest/cheapest Claude available on CodeCraft (no Haiku listed)
    provider: openai_compatible
    model: claude-sonnet-5
    base_url: https://codecraftapi.com/v1
    api_key_env: CODECRAFT_API_KEY
    fallback_key_envs: [CODECRAFT_API_KEY_2, CODECRAFT_API_KEY_3]
    max_tokens: 4000          # a harness is small; keep cost down
  codecraft-opus:             # stronger Claude for hard harnesses / escalation
    provider: openai_compatible
    model: claude-opus-5-5
    base_url: https://codecraftapi.com/v1
    api_key_env: CODECRAFT_API_KEY
    fallback_key_envs: [CODECRAFT_API_KEY_2, CODECRAFT_API_KEY_3]
    max_tokens: 4000
  local-harness:              # our fine-tuned Qwen2.5-Coder + LoRA, via training/serve/serve_local.py
    provider: openai_compatible
    model: harness
    base_url: http://127.0.0.1:8000/v1
    max_tokens: 1536          # generation stops at the end-of-turn token; this is only a cap
    temperature: 0.0
