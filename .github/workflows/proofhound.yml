# ProofHound — confirm real vulnerabilities on every push / PR.
#
# Copy this file into any repo's .github/workflows/. It analyzes the pushed commit's changed
# functions, writes fuzzing harnesses with the ProofHound model, proves which findings actually
# crash, and uploads the result as SARIF (GitHub Security tab + inline PR annotations).
#
# The model needs a GPU, so it is served separately and reached over HTTP. Set the repo secret
# MODEL_ENDPOINT to the served model's OpenAI-compatible base URL (e.g. an SSH-tunnelled vast.ai
# box from deploy/demo_server.py, or a scale-to-zero HF Inference Endpoint). Everything else —
# SAST and the Jazzer.js fuzzing in Docker — runs on the standard GitHub runner.

name: ProofHound
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  security-events: write   # needed to upload SARIF to code scanning

jobs:
  proofhound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2        # need the parent commit to diff changed functions

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ProofHound
        run: |
          pip install -e .
          pip install semgrep

      - name: Build the Jazzer.js sandbox image
        run: docker build -t proofhound/jazzerjs:latest docker/jazzerjs/

      - name: Scan the pushed commit
        env:
          # The config's local-harness model reads this; point it at the served model.
          MODEL_ENDPOINT: ${{ secrets.MODEL_ENDPOINT }}
        run: |
          proofhound scan \
            --repo . \
            --commit HEAD \
            --agent multi \
            --model local-harness

      - name: Upload results to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: runs
          category: proofhound
