# Publish ProofHound to PyPI via OIDC Trusted Publishing (no API token needed).
#
# Triggers when you push a version tag (e.g. git tag v0.1.0 && git push origin v0.1.0)
# or publish a GitHub Release. The build runs, then gh-action-pypi-publish exchanges
# the workflow's OIDC identity for a short-lived PyPI token — so nothing secret is stored.
#
# Requires: on pypi.org, a Trusted Publisher configured for this repo with
#   workflow name = publish.yml and environment = pypi.

name: Publish to PyPI
on:
  push:
    # Match v0.1.0 etc. but NOT vscode-v* (which triggers the VS Code publish).
    tags: ["v[0-9]*"]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi            # must match the Trusted Publisher config
    permissions:
      id-token: write            # required for OIDC token exchange
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
