[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofhound"
version = "0.1.0"
description = "Agentic vulnerability discovery and repair: SAST-guided LLM fuzzing for JS/TS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "unidiff>=0.7",
  "rich>=13.7",
  "anthropic>=1.13",
  "openai>=3.29",
  "python-dotenv>=1.0",
  "tree-sitter>=0.25,<0.26",  # 0.26.0 crashes (access violation) on larger files
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-python>=0.23,<0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
proofhound = "proofhound.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/proofhound"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PL", "RUF"]
ignore = [
  "PLR2004",  # magic value in comparison — fine here
  "PLR0913", "PLR0917",  # many (positional) args — agents/tools take explicit deps by design
  "PLR0911", "PLR0915",  # many returns/statements — validation ladders are naturally branchy
  "PLC0415",  # import not at top — we lazy-import optional deps and in tests on purpose
  "UP042",  # str+Enum is intentional (stable, widely used); not switching to StrEnum
]

[tool.ruff.lint.per-file-ignores]
# Typer uses function calls (typer.Option/Argument) in defaults by design.
"src/proofhound/cli.py" = ["B008"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
