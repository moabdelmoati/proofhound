rules:
  - id: proofhound.js.prototype-pollution
    message: >-
      [source: $P] [sink: $SINK]
      A function parameter or request value is used as an object key in a recursive
      merge/set ($SINK) without rejecting "__proto__"/"constructor"/"prototype". An attacker can
      pollute Object.prototype.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      vuln_class: prototype-pollution
      cwe: "CWE-1321"
    mode: taint
    options:
      taint_unify_mvars: true
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: function $F(..., $P, ...) { ... }
              - pattern-inside: function (..., $P, ...) { ... }
              - pattern-inside: (..., $P, ...) => { ... }
              - pattern-inside: (..., $P, ...) => $BODY
          - focus-metavariable: $P
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.body
          - pattern: $REQ.params
    pattern-sinks:
      - patterns:
          - pattern-either:
              # Writing through an attacker-controlled key: obj[key] = ... / obj[key][k2] = ...
              - pattern: $OBJ[$SINK] = $VAL
              - pattern: $OBJ[$SINK][$K2] = $VAL
          - focus-metavariable: $SINK
